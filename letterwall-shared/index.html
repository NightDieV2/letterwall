<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Our Letter Wall</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 7 6' shape-rendering='crispEdges'%3E%3Cpath fill='%23ff4f8b' d='M1 0h2v1H1zM4 0h2v1H4zM0 1h7v2H0zM1 3h5v1H1zM2 4h3v1H2zM3 5h1v1H3z'/%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&family=Gaegu:wght@400;700&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="sky" aria-hidden="true"></div>

    <header>
        <p class="kicker"><span class="px-heart"></span> made with love <span class="px-heart"></span></p>
        <h1>Our Letter Wall</h1>
        <p class="sub">Leave a little love note. Tap an envelope to open it.</p>
        <div class="actions">
            <button id="open-modal-btn" class="primary"><span class="px-heart light"></span> Leave a letter</button>
            <button id="owner-login-btn" class="ghost">Owner login</button>
        </div>
    </header>

    <main id="letter-wall" aria-live="polite"></main>

    <footer><span class="px-heart"></span> xoxo <span class="px-heart"></span></footer>

    <div id="letter-modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="modal-title">
        <div class="modal-content">
            <h2 id="modal-title">Write a love letter</h2>
            <textarea id="letter-input" maxlength="1000" placeholder="Dear you..."></textarea>
            <input type="text" id="author-input" maxlength="40" placeholder="Your name (optional)">

            <div class="attach">
                <label class="attach-pick" for="file-input">
                    <span class="clip" aria-hidden="true">📎</span>
                    <span>Attach a photo or file <em>(optional, up to 4 MB)</em></span>
                </label>
                <input type="file" id="file-input" class="visually-hidden">
                <div id="file-chosen" class="file-chosen hidden">
                    <img id="file-thumb" class="hidden" alt="">
                    <span id="file-name"></span>
                    <button type="button" id="file-clear" class="link" aria-label="Remove attached file">remove</button>
                </div>
            </div>

            <p id="form-error" class="error" role="alert"></p>
            <div class="modal-actions">
                <button id="close-modal-btn" class="ghost">Cancel</button>
                <button id="submit-letter-btn" class="primary">Send with love</button>
            </div>
        </div>
    </div>

    <div id="toast" class="toast" role="status"></div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
